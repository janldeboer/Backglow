name: Build

on:
  push:
    branches: [main]
    tags: ["v3.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Core tests
        run: swift test --disable-sandbox

      - name: Build app
        # No signing identity on CI; the app is signed ad hoc.
        env:
          SIGN_IDENTITY: "-"
        run: ./scripts/build-app.sh

      - name: Package DMG
        run: ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Backglow-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Hand-written notes in docs/releases/<tag>.md win over generated ones.
        run: |
          notes=(--generate-notes)
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then notes=(--notes-file "docs/releases/$GITHUB_REF_NAME.md"); fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Backglow $GITHUB_REF_NAME" "${notes[@]}" --prerelease
