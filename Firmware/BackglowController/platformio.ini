[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 230400
lib_deps = fastled/FastLED@3.10.3

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
build_flags = -DLED_DATA_PIN=18

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags = -DLED_DATA_PIN=5
