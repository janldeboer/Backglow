[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 230400
lib_deps = fastled/FastLED@3.10.3

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
build_flags = -DLED_DATA_PIN=18

; Same firmware with the LED data line on GPIO2, as in the original sketch.
[env:esp32dev_gpio2]
extends = env:esp32dev
build_flags = -DLED_DATA_PIN=2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags = -DLED_DATA_PIN=5

; GPIO2 is pin D4 on a NodeMCU board.
[env:nodemcuv2_gpio2]
extends = env:nodemcuv2
build_flags = -DLED_DATA_PIN=2
