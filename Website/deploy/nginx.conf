server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Public policy: no routine request logging, including error-request logs.
    access_log off;
    error_log /dev/null;
    absolute_redirect off;
    charset utf-8;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
    location /en/ {
        try_files $uri $uri/ =404;
        error_page 404 /en/404.html;
    }
    location = /en/404.html { internal; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
}
